plugins {
    id 'com.android.application'
}

def appUrl = (project.findProperty('APP_URL') ?: '').toString().trim()

android {
    namespace 'com.indiastockadvisor.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.indiastockadvisor.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'APP_URL', '"' + appUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
