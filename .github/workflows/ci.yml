name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Unpack zip into the repo
        if: github.event_name != 'pull_request'
        run: if [ -f india-stock-advisor.zip ] && { [ ! -f app.py ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx india-stock-advisor.zip; }; then unzip -oq india-stock-advisor.zip -d _unpack; SRC=_unpack; [ -d _unpack/india-stock-advisor ] && SRC=_unpack/india-stock-advisor; rm -rf "$SRC/.github"; cp -a "$SRC"/. ./; rm -rf _unpack; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com; git add -A; if ! git diff --cached --quiet; then git commit -m "Unpack project files from zip"; git push origin HEAD:"$GITHUB_REF_NAME"; fi; else echo Nothing to unpack; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Block leaked API keys
        run: if grep -rEn 'AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,}' --include='*.py' --include='*.toml' --include='*.md' .; then exit 1; fi

      - name: Compile check
        run: python -m py_compile app.py engine.py gemini_client.py themes.py   # CHANGED

      - name: Lint
        continue-on-error: true
        run: ruff check --select E9,F .

      - name: Run tests
        run: pytest -q

      - name: Prepare downloadable app folder
        run: mkdir -p dist && cp -r app.py engine.py gemini_client.py themes.py requirements.txt README.md .streamlit tests dist/ && printf 'pip install -r requirements.txt\nstreamlit run app.py\n' > dist/start.sh && printf '@echo off\r\npip install -r requirements.txt\r\nstreamlit run app.py\r\npause\r\n' > dist/start.bat   # CHANGED

      - name: Upload app as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-stock-advisor-app
          path: dist
          retention-days: 30

  apk:
    needs: check
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        if: hashFiles('android/app/build.gradle') != ''
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('android/app/build.gradle') != ''
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        if: hashFiles('android/app/build.gradle') != ''
        working-directory: android
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: gradle assembleDebug --no-daemon -PAPP_URL="$APP_URL"

      - name: Upload APK
        if: hashFiles('android/app/build.gradle') != ''
        uses: actions/upload-artifact@v4
        with:
          name: india-stock-advisor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: if [ -n "$APP_URL" ]; then curl -sS -L -o /dev/null -w "HTTP %{http_code}\n" "$APP_URL"; else echo Add a repository variable named APP_URL to enable pinging; fi
